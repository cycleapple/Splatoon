When the game tells you that ability A has distance D,\nin fact it means that you are allowed to execute\nability A if distance between edge of your hitbox\nand enemy's hitbox is less or equal than distance D,\nthat is for targeted abilities.\nIf an ability is AoE, such check is performed between\nmiddle point of your character and edge of enemy's hitbox.\n\nSummary: if you are trying to make targeted ability indicator -\nenable both "+your hitbox" and "+target hitbox".\nIf you are trying to make AoE ability indicator - \nenable only "+target hitbox" to make indicators valid.==當遊戲告訴你技能A有距離D時，\n實際上這意味著如果你的hitbox邊緣和敵人的hitbox之間的距離小於或等於距離D，\n那麼你可以執行技能A，\n這是針對單體目標技能的。\n如果一個技能是AoE，則在您角色的hitbox和敵人的hitbox邊緣之間執行該檢查。\n\n總結：如果您正嘗試製作單目標技能繪製，請同時啟用“+你的hitbox”和“+目標hitbox“。\n如果您試圖使AoE技能繪製-\n請僅啟用“+目標hitbox”使繪製有效。
