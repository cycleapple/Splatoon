Splatoon supports few renderers. On this page, you can select which ones you want to use, configure them and set one of them as default.Render engine can be set globally and per-element. When set render engine is not available, either due to load error or because user has disabled it, other available render engine will be used automatically.Settings present in this section affect all available renderes.==Splatoon支援的渲染器很少。在此頁面上，您可以選擇要使用的選項，設定它們並將其中一個設定為預設值。渲染引擎可以全域設定，也可以按元素設定。當設定的渲染引擎不可用時，無論是由於載入錯誤還是使用者停用了它，都會自動使用其他可用的渲染引擎。此部分中的設定會影響所有可用的渲染器。
